# Upstream Homer config (serves /www, Cache-Control rules, IPv6 listener)
include "/lighttpd.conf"

# Access log to the container's stdout through a pipe: lighttpd drops to the
# lighttpd user before opening its logs, and that user can't reopen /dev/fd/3.
accesslog.filename := "|/bin/cat"

# Basic auth (see auth.lua). mod_magnet is built into the upstream lighttpd.
server.modules += ( "mod_magnet" )
magnet.attract-raw-url-to = ( "/railway-auth.lua" )
